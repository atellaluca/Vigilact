site_name: Vigilact Documentation
site_description: Open protocol experiment for negotiated operational contracts and observable commitments.
site_url: https://vigilact.atellaluca.com/
repo_url: https://github.com/atellaluca/vigilact
repo_name: atellaluca/vigilact
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright © 2026 Luca Atella · Apache-2.0
strict: true
use_directory_urls: true
theme:
  name: mkdocs
  locale: en
  navigation_depth: 3
  highlightjs: true
  hljs_languages: [python, javascript, json, bash, yaml]
plugins:
  - search
extra_css:
  - assets/styles.css
