site_name: Vigilact
site_description: Open protocol experiment for negotiated operational contracts and observable commitments.
site_url: https://vigilact.atellaluca.com/
repo_url: https://github.com/atellaluca/vigilact
repo_name: atellaluca/vigilact
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 Luca Atella · Apache-2.0
strict: true
use_directory_urls: true

# Share the Material for MkDocs navigation and layout of ImportSpy,
# but use Vigilact's own navy/teal brand palette from its SVG logo.
# Custom colors are defined in docs/assets/styles.css.
theme:
  name: material
  language: en
  logo: assets/vigilact-logo.svg
  favicon: assets/favicon.ico
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.top
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences

extra_css:
  - assets/styles.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/atellaluca
      name: Luca Atella on GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/luca-atella/
      name: Luca Atella on LinkedIn
    - icon: fontawesome/solid/globe
      link: https://profile.atellaluca.com/
      name: Developer portfolio
    - icon: fontawesome/solid/envelope
      link: mailto:info@atellaluca.com
      name: Contact the maintainer

nav:
  - Home: index.md
  - Get started:
      - Install and run: getting-started/install.md
      - Five-minute HTTP demo: getting-started/five-minute-demo.md
      - Your first contract: getting-started/first-contract.md
  - Contracts & observations:
      - Mental model: concepts/mental-model.md
      - Architecture: concepts/architecture.md
      - Contracts and observations: concepts/contracts.md
      - Evaluation semantics: concepts/evaluation-semantics.md
      - Core protocol profile: concepts/core-profile.md
      - Failure semantics: concepts/failure-semantics.md
      - Wire timestamps: concepts/wire-timestamps.md
      - Identity and trust: concepts/trust.md
  - Integrate & extend:
      - Python SDK: guides/python.md
      - JavaScript client: guides/javascript.md
      - Independent Go observer: guides/go-observer.md
      - Backup integration: guides/backup-integration.md
      - Observe and act: guides/observe-and-act.md
      - Consume the outbox: guides/outbox.md
      - Agent capabilities: protocol/capabilities.md
      - Remote commands: protocol/commands.md
      - Safe command lifecycle: protocol/command-lifecycle.md
  - Reference:
      - HTTP API: protocol/http-api.md
      - Evidence and evaluations: protocol/events.md
      - Configuration: reference/configuration.md
      - Compatibility and versions: reference/compatibility.md
      - Conformance: reference/conformance.md
      - Publication gates: reference/publication-gates.md
      - Cross-language semantic vectors: reference/semantic-vectors.md
      - Error catalog: reference/error-catalog.md
      - Security and limitations: reference/security.md
      - Threat model: reference/threat-model.md
      - Release evidence: reference/release-evidence.md
      - Engineering proof: reference/engineering-evidence.md
      - Troubleshooting: reference/troubleshooting.md
      - Glossary: reference/glossary.md
      - Frequently asked questions: reference/faq.md
  - Project:
      - Project & maintainer: project-and-maintainer.md
      - Contributing: reference/contributing.md
      - Documentation workflow: maintainers/docs-workflow.md
      - Poetry environment and packaging: maintainers/poetry-workflow.md
      - Custom domain on GitHub Pages: maintainers/github-pages.md
      - SQLite backup and recovery: maintainers/storage-backup.md
