name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'scripts/check_docs.py'
      - 'scripts/check_pages_config.py'
      - 'scripts/check_branding.py'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'docs/assets/vigilact-readme-banner.png'
      - 'api/**'
      - 'src/**'
      - 'examples/http_contract_demo.py'
      - 'tests/test_documentation_walkthrough.py'
      - 'spec/**'
      - 'implementations/go-observer/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'scripts/check_docs.py'
      - 'scripts/check_pages_config.py'
      - 'scripts/check_branding.py'
      - '.github/workflows/docs.yml'
      - 'README.md'
      - 'docs/assets/vigilact-readme-banner.png'
      - 'api/**'
      - 'src/**'
      - 'examples/http_contract_demo.py'
      - 'tests/test_documentation_walkthrough.py'
      - 'spec/**'
      - 'implementations/go-observer/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install Poetry 2.5.2
        run: pipx install poetry==2.5.2
      - name: Check lock and install documentation group
        run: |
          poetry check --lock
          poetry sync --all-groups --all-extras
      - name: Check navigation, links and endpoint coverage
        run: poetry run python scripts/check_docs.py
      - name: Check custom domain configuration
        run: poetry run python scripts/check_pages_config.py
      - name: Check project branding and maintainer links
        run: poetry run python scripts/check_branding.py
      - name: Test published HTTP walkthrough
        run: poetry run python -m pytest -q tests/test_documentation_walkthrough.py
      - name: Build strict MkDocs site
        run: poetry run mkdocs build --strict
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
