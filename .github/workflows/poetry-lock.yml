name: Generate Poetry lock (maintainer)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Generate verifiable poetry.lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Poetry 2.5.2
        run: pipx install poetry==2.5.2
      - name: Generate and validate the real lockfile
        run: |
          poetry lock
          poetry check --lock
      - name: Upload lockfile for review and commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vigilact-poetry-lock
          path: poetry.lock
          if-no-files-found: error
          retention-days: 14
