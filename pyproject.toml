# Single source of truth for Python packaging and development environments.
# Poetry 2.5.x is used by GitHub Actions and contributors.
[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "vigilact-protocol"
version = "0.4.0a3"
description = "An open protocol experiment for negotiated operational contracts and observable commitments"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
authors = [{name = "Luca Atella", email = "info@atellaluca.com"}]
keywords = ["operational-contracts", "observability", "distributed-systems", "protocol", "cloudevents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
# Keep the current runtime contract unchanged during the packaging migration.
# Pin the two schema-generator dependencies so exported OpenAPI/JSON Schema stays stable.
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.5",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
client = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://github.com/atellaluca/vigilact"
Documentation = "https://vigilact.atellaluca.com/"
Source = "https://github.com/atellaluca/vigilact"
Issues = "https://github.com/atellaluca/vigilact/issues"

[tool.poetry]
requires-poetry = ">=2.5.0,<3.0.0"
packages = [{include = "vigilact", from = "src"}]
# The wheel remains minimal; the sdist includes reproducibility assets and both observers.
include = [
  {path = "spec", format = "sdist"},
  {path = "api", format = "sdist"},
  {path = "schemas", format = "sdist"},
  {path = "tests", format = "sdist"},
  {path = "scripts", format = "sdist"},
  {path = "examples", format = "sdist"},
  {path = "implementations", format = "sdist"},
  {path = "docs", format = "sdist"},
  {path = "outreach", format = "sdist"},
  {path = "research", format = "sdist"},
  {path = ".github", format = "sdist"},
  {path = "mkdocs.yml", format = "sdist"},
  {path = "Makefile", format = "sdist"},
  {path = "CHANGELOG.md", format = "sdist"},
  {path = "CONTRIBUTING.md", format = "sdist"},
  {path = "SECURITY.md", format = "sdist"},
  {path = "NOTICE", format = "sdist"},
]
exclude = ["**/__pycache__", "**/*.pyc", "site", "dist", "artifacts", "*.sqlite3"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
httpx = ">=0.27,<1"
jsonschema = ">=4.20,<5"
ruff = ">=0.14,<1"
build = ">=1.2,<2"
twine = ">=6,<7"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["vigilact"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
fail_under = 90

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["build", "dist", "api", "schemas"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
