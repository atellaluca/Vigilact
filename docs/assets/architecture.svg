<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 248" role="img" aria-labelledby="ttl desc">
<title id="ttl">Vigilact architecture</title>
<desc id="desc">An agent on the left sends proposals and evidence to a central observer. A downstream consumer receives neutral outcomes and decides whether to notify or automate. Agents can also advertise optional capabilities.</desc>
<rect width="920" height="248" rx="15" fill="#f4f8fb"/>
<rect x="28" y="30" width="246" height="186" rx="12" fill="#e6f3f7" stroke="#257988" stroke-width="2"/>
<rect x="338" y="30" width="244" height="186" rx="12" fill="#e8edf9" stroke="#456dab" stroke-width="2"/>
<rect x="646" y="30" width="246" height="186" rx="12" fill="#eaf6ef" stroke="#31805c" stroke-width="2"/>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#16334b">
<text x="151" y="69" font-size="21" font-weight="700">Agent</text>
<text x="151" y="99" font-size="15">Proposes a commitment</text>
<text x="151" y="123" font-size="15">Publishes evidence</text>
<text x="151" y="147" font-size="15">Exposes capabilities</text>
<text x="460" y="69" font-size="21" font-weight="700">Observer</text>
<text x="460" y="99" font-size="15">Accepts exact terms</text>
<text x="460" y="123" font-size="15">Evaluates deadlines</text>
<text x="460" y="147" font-size="15">Writes durable outbox</text>
<text x="769" y="69" font-size="21" font-weight="700">Consumer</text>
<text x="769" y="99" font-size="15">Reads outcomes</text>
<text x="769" y="123" font-size="15">Owns external effects</text>
<text x="769" y="147" font-size="15">Notifications optional</text>
</g>
<g stroke="#526b83" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M276 100H326"/><path d="M316 91L327 100L316 109"/>
<path d="M584 100H633"/><path d="M623 91L634 100L623 109"/>
</g>
<g fill="#456178" font-family="Arial, sans-serif" font-size="12" text-anchor="middle"><text x="301" y="84">HTTP</text><text x="608" y="84">events</text><text x="460" y="185">Persistent, independent of connection</text></g>
</svg>
